# =============================================================================
# TraceBox Dashboard — Fly.io app tanımı.
#
# Collector'dan AYRI bir app (CLAUDE.md §9.1): tek platform, tek fatura, ama
# iki bağımsız deploy. Dashboard'ın yeniden yayınlanması cihazların yazma
# yolunu kesmemeli.
# =============================================================================

app = "tracebox-dashboard"

primary_region = "fra"

[build]
  # NEXT_PUBLIC_* değerleri DERLEME ANINDA gömülüyor (bkz. Dockerfile), bu
  # yüzden `fly secrets` ile verilemezler — secret'lar yalnızca çalışma
  # zamanında var. Üçü de tarayıcıya inen açık değerler; sır olan
  # SUPABASE_SERVICE_KEY yalnızca collector'da durur.
  #
  # Aşağıdaki yer tutucular deploy'dan ÖNCE gerçek değerlerle doldurulmalı
  # (ya da `fly deploy --build-arg NEXT_PUBLIC_SUPABASE_URL=... ` ile
  # geçilmeli). Boş bırakılırsa derleme, imaj üretilmeden hata verir.
  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = "https://xxxxxxxxxxxx.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOi..."
    NEXT_PUBLIC_COLLECTOR_URL = "https://tracebox-collector.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  processes = ["app"]

  # --- uyku (§9.12'nin açık bıraktığı karar) --------------------------------
  # SOĞUK AÇILIŞ KABUL EDİLDİ. Trafiği olmayan bir vitrin sayfasının 1-3
  # saniye erken açılması için her ay makine kirası ödemek yanlış takas;
  # üstelik standalone imaj küçük olduğu için o gecikme kısa.
  #
  # Kararı çevirmek tek satır: min_machines_running = 1 (ve bir deploy).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # --- sağlık kontrolü BİLEREK YOK ------------------------------------------
  # Uyuyan bir makinede zaten çalışmaz; uyanıkken 30 saniyede bir istek atmak
  # ise makineyi ayakta tutma riski taşır — yani yukarıdaki uyku kararını
  # sessizce aylık bir faturaya çevirebilirdi. Bozuk bir deploy zaten ilk
  # ziyarette ve `fly logs`'ta görünür.

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB, Next'in standalone sunucusu için rahat. Sunucu SSR ile veri
  # çekmiyor (§9.1) — işi dosya sunmak, bellek profili düz.
  memory = "512mb"
